{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kivun Tech{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Consultoria em tecnologia para transformar desafios em direção, clareza e resultados.{% endblock %}">
  <meta name="robots" content="{% block meta_robots %}index, follow{% endblock %}">
  <meta name="theme-color" content="#070b18">
  <link rel="canonical" href="{{ canonical_url }}">
  <link rel="sitemap" type="application/xml" title="Sitemap" href="{% url 'sitemap' %}">
  <link rel="icon" href="{% static 'favicon/favicon.svg' %}" type="image/svg+xml" sizes="any">
  <link rel="icon" href="{% static 'favicon/favicon-16.png' %}" sizes="16x16" type="image/png">
  <link rel="icon" href="{% static 'favicon/favicon-32.png' %}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'favicon/apple-touch-icon.png' %}">
  <link rel="preload" href="{% static 'fonts/Geist-Variable.woff2' %}" as="font" type="font/woff2" crossorigin>
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Kivun Tech">
  <meta property="og:title" content="{% block og_title %}Kivun Tech{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Consultoria em tecnologia para transformar desafios em direção, clareza e resultados.{% endblock %}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{{ og_image_url }}">
  <meta property="og:image:secure_url" content="{{ og_image_url }}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kivun Tech — direção estratégica para transformar tecnologia em resultados">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}Kivun Tech{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Consultoria em tecnologia para transformar desafios em direção, clareza e resultados.{% endblock %}">
  <meta name="twitter:image" content="{{ og_image_url }}">
  <meta name="twitter:image:alt" content="Kivun Tech — direção estratégica para transformar tecnologia em resultados">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_head %}{% endblock %}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "{{ site_url|escapejs }}#professional-service",
          "name": "Kivun Tech",
          "url": "{{ site_url|escapejs }}",
          "description": "Consultoria em TI, análise de sistemas, integrações, automação de processos e dados.",
          "image": "{{ og_image_url|escapejs }}",
          "logo": "{{ logo_url|escapejs }}",
          "areaServed": [
            {"@type": "City", "name": "Porto Alegre"},
            {"@type": "AdministrativeArea", "name": "Rio Grande do Sul"},
            {"@type": "Country", "name": "Brasil"}
          ],
          "founder": {"@id": "{{ site_url|escapejs }}#nathan"}
        },
        {
          "@type": "WebSite",
          "@id": "{{ site_url|escapejs }}#website",
          "url": "{{ site_url|escapejs }}",
          "name": "Kivun Tech",
          "description": "Direção estratégica para transformar tecnologia em resultados.",
          "inLanguage": "pt-BR",
          "publisher": {"@id": "{{ site_url|escapejs }}#professional-service"}
        },
        {
          "@type": "Person",
          "@id": "{{ site_url|escapejs }}#nathan",
          "name": "Nathan Maria da Silva",
          "jobTitle": "Analista de Sistemas",
          "url": "{{ site_url|escapejs }}#experiencia",
          "sameAs": [
            "https://www.linkedin.com/in/nathanmaria2000/",
            "https://github.com/Nathanms1"
          ],
          "worksFor": {"@id": "{{ site_url|escapejs }}#professional-service"}
        }
      ]
    }
  </script>
</head>
<body>
  {% include 'includes/skip_link.html' %}
  {% include 'includes/header.html' %}
  <main id="conteudo" class="site-main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
    {% include 'includes/whatsapp_float.html' %}
    {% include 'includes/footer.html' %}
  <script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
